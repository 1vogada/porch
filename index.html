<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Access</title>
<style>
  :root { --bg: #f4f5f7; --panel: #fff; --text: #1d2330; --muted: #677085; --line: #d9dde4; --accent: #2f5fd0; --bad: #b3392f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #98a1b3; --line: #2c323d; --accent: #7aa2ff; --bad: #e07068; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, "Segoe UI", sans-serif; padding: 16px; }
  form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  h1 { font-size: 17px; margin: 0 0 12px; font-weight: 600; }
  input { width: 100%; font: 16px ui-monospace, Consolas, monospace; letter-spacing: .04em; padding: 10px; border-radius: 6px;
          border: 1px solid var(--line); background: var(--bg); color: var(--text); text-transform: uppercase; }
  button { margin-top: 12px; width: 100%; font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 6px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  #m { min-height: 20px; margin-top: 10px; font-size: 14px; color: var(--bad); }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Enter your key</h1>
  <input id="k" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" spellcheck="false" autocapitalize="characters" required>
  <button id="b" type="submit">Continue</button>
  <div id="m"></div>
</form>
<script>
  // the server's address, lightly obfuscated (not a secret: the server checks the key); written by the publish script
  const c = ["bW9jLmV","yYWxmZH","VvbGN5c","nQubGFv","Yy1zcm9","0YWN1ZG","UtdG5la","XRhcC1l","dGFwaWN","pdHJhcC","8vOnNwd","HRo"];
  const at = () => atob(c.join("")).split("").reverse().join("");
  const f = document.getElementById("f"), k = document.getElementById("k"), b = document.getElementById("b"), m = document.getElementById("m");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    b.disabled = true; m.textContent = "";
    try {
      const r = await fetch(at() + "/verify", {
        method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key: k.value }),
        credentials: "omit", referrerPolicy: "no-referrer", cache: "no-store",
      });
      const j = await r.json().catch(() => ({}));
      if (j.ok && j.url && new URL(j.url).origin === new URL(at()).origin) { location.replace(j.url); return; }
      m.textContent = j.error || "invalid key";
    } catch { m.textContent = "Not reachable right now. Try again later."; }
    b.disabled = false;
  });
</script>
</body>
</html>
